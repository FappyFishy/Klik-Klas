<!DOCTYPE html>
<html>

<head>
   <link rel="stylesheet" href="css/ruimte.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
   <title>Ruimte</title>
   <script src="js/ruimte.js"></script>
</head>

<body>
   <header class="shadow-s">
      <p class="logo">Klik&Klas</p>

   </header>
   <div id="mycard" class="d-flex justify-content-center">
      <span class="border border-4 rounded-4">
         <div class="card text-center rounded-4 shadow-lg" style="width: 40rem; height: 40rem;">
            <div class="card-body">
               <h2 class="card-title">Naam</h2>
               <div class="invoer">
                  <label>Mensen:</label>
                  <input type="number"><br><br>
                  <label>Reden:</label>
                  <input type="text" maxlength="255" required>
               </div>
      </span>
   </div>
   </div>
   </div>

   <div id="carouselExampleControls" class="carousel slide" data-bs-interval="false">
      <div id="mycard2" class="d-flex justify-content-center">
         <span class="border border-4 rounded-4">
            <div class="card text-center rounded-4 shadow-lg" style="width: 47rem; height: 36rem;">
               <div class="card-body">
                  <div class="carousel-inner">
                     <div class="carousel-item active">
                        <h3 class="card-title" id="cDate"></h3>
                        <div class="calendar-weekdays">
                           <p id="days"></p>
                        </div>
                     </div>
                     <div class="carousel-item">
                        <h3 class="card-title" id="cDate2"></h3> 
                        <div class="calendar-weekdays">
                           <p id="days2"></p>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </span>
         <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true" style="background-color: blue; border-radius: 25%; margin-top: 29rem;"></span>
         </button>
         <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true" style="background-color: blue; border-radius: 25%; margin-top: 29rem;"></span>
         </button>
      </div>
   </div>
   
   <script>myCalender();</script>
</body>

</html>
